controller_manager:
  ros__parameters:
    update_rate: 100  # Increased to 100 Hz for smooth, high-frequency RL control

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # We replace the trajectory controller with the velocity controller
    velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# Configuration for our new JointGroupVelocityController
velocity_controller:
  ros__parameters:
    joints:
      - front_left_wheel_joint
      - front_right_wheel_joint
      - back_left_wheel_joint
      - back_right_wheel_joint

# Configuration for JointTrajectoryController
joint_trajectory_controller:
  ros__parameters:
    joints:
      - front_left_wheel_joint
      - front_right_wheel_joint
      - back_left_wheel_joint
      - back_right_wheel_joint
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity